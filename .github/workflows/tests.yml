name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Действия закреплены по SHA (в комментарии — версия); Xcode зафиксирован: тот, что стоит на образе macos-26
      # (Xcode_26.6.app, Swift 6.3), а не «последний стабильный», который меняется без нашего ведома.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'
      # Названия чужих продуктов в репозитории не допускаются (стоп-лист — scripts/forbidden-names.txt).
      - name: Названия
        run: ./scripts/check-names.sh
      - name: Версия Swift
        run: swift --version
      # Правило «без предупреждений» проверяется автоматически: любое предупреждение компилятора — ошибка.
      # Те же флаги в обоих шагах, чтобы тесты не пересобирали проект заново.
      - name: Сборка
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Тесты
        run: swift test -Xswiftc -warnings-as-errors
