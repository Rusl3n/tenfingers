name: Ошибка · Bug
description: Что-то работает не так · Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщили! Писать можно по-русски или по-английски.
        Thanks for reporting! Russian or English are both fine.
  - type: input
    id: version
    attributes:
      label: Версия приложения · App version
      description: «О программе» или низ настроек · About window or bottom of Settings
      placeholder: 3.0.1 (1027)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Версия macOS · macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: layout
    attributes:
      label: Раскладка · Keyboard layout
      placeholder: Русская – ПК, ABC
  - type: textarea
    id: steps
    attributes:
      label: Что вы делали · Steps to reproduce
      placeholder: |
        1. Открыл «Курс» · Opened "Course"
        2. ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Что получилось и что ожидали · What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Снимки экрана, другое · Screenshots, anything else
